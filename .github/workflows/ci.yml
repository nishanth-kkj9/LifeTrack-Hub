name: LifeTrack Hub CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  web-and-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # jsdom-based UI tests require Node >= 20.19; 22 is the current LTS
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        # Strict lockfile install — no silent fallback that masks drift
        run: npm ci

      - name: Web Typecheck & Lint
        run: npm run lint

      - name: Web Build
        run: npm run build

      - name: Web Test Suites (UI workflows + API router + rules integrity)
        run: npm test

  kmp-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permissions
        run: chmod +x gradlew

      # :shared applies com.android.library, so even desktop-only tasks need an
      # Android SDK present for Gradle configuration to succeed.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Shared KMP Desktop Test Suite
        run: ./gradlew :shared:desktopTest --no-daemon

      - name: Upload desktop test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmp-desktop-test-reports
          path: shared/build/reports/

  android-debug-build:
    runs-on: ubuntu-latest
    # Flip to required once confirmed green a few runs in a row:
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permissions
        run: chmod +x gradlew

      - name: Assemble Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon
