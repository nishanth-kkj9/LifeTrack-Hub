name: LifeTrack Hub CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  web-and-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Web Typecheck & Lint
        run: npm run lint

      - name: Web Build
        run: npm run build

      - name: Firestore Security Rules Emulator Tests
        run: npm run test:rules

  kmp-shared-and-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Grant Execute Permissions
        run: chmod +x gradlew

      - name: Shared KMP Test Suite
        run: ./gradlew :shared:test --no-daemon

      - name: Desktop Target Verification
        run: ./gradlew :shared:desktopTest --no-daemon
